<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 675" role="img" aria-labelledby="title desc">
<title id="title">Супер-блендер</title>
<desc id="desc">Детализированная чёткая иллюстрация профессионального чёрного супер-блендера с высокой прозрачной чашей, массивным основанием и панелью управления, с аксессуарами.</desc>
<defs>
 <linearGradient id="pitcher" x1="0" y1=".07" x2="1" y2=".12"><stop stop-color="#a3b8c3" stop-opacity=".87"/><stop offset=".12" stop-color="#faffff" stop-opacity=".72"/><stop offset=".29" stop-color="#c7d7dc" stop-opacity=".5"/><stop offset=".56" stop-color="#eaf7fb" stop-opacity=".16"/><stop offset=".78" stop-color="#899ba7" stop-opacity=".7"/><stop offset="1" stop-color="#ecfbff" stop-opacity=".85"/></linearGradient>
 <linearGradient id="glassLine" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#66717d"/><stop offset=".3" stop-color="#f4ffff"/><stop offset=".71" stop-color="#72838e"/><stop offset="1" stop-color="#effbff"/></linearGradient>
 <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#747780"/><stop offset=".2" stop-color="#1b2027"/><stop offset=".51" stop-color="#101216"/><stop offset=".8" stop-color="#53565f"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2=".19"><stop stop-color="#434651"/><stop offset=".11" stop-color="#1d2028"/><stop offset=".37" stop-color="#07090e"/><stop offset=".67" stop-color="#292b32"/><stop offset=".88" stop-color="#080a0f"/><stop offset="1" stop-color="#4c515a"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#1e232c"/><stop offset=".20" stop-color="#080b0e"/><stop offset=".55" stop-color="#272b34"/><stop offset=".85" stop-color="#0d0e14"/><stop offset="1" stop-color="#262935"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68727e"/><stop offset=".20" stop-color="#f4f6f8"/><stop offset=".41" stop-color="#9ca5aa"/><stop offset=".65" stop-color="#303741"/><stop offset=".85" stop-color="#dde3e6"/><stop offset="1" stop-color="#555f6d"/></linearGradient>
 <linearGradient id="handle" x1="0" y1=".2" x2="1" y2=".8"><stop stop-color="#2a2c35"/><stop offset=".23" stop-color="#d1dae0"/><stop offset=".51" stop-color="#f6ffff"/><stop offset=".78" stop-color="#7f8894"/><stop offset="1" stop-color="#151a20"/></linearGradient>
 <linearGradient id="tamper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#171923"/><stop offset=".42" stop-color="#4e5461"/><stop offset=".58" stop-color="#141721"/><stop offset="1" stop-color="#0b0d13"/></linearGradient>
 <radialGradient id="screen"><stop stop-color="#293e36"/><stop offset=".8" stop-color="#152821"/><stop offset="1" stop-color="#09110f"/></radialGradient>
 <filter id="shadow" x="-45%" y="-45%" width="190%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="smallshadow" x="-20%" y="-30%" width="150%" height="170%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="jugclip"><path d="M146 117 L370 117 353 363 Q259 379 168 363 Z"/></clipPath>
</defs>
